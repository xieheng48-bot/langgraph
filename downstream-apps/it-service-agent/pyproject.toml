[project]
name = "it-service-agent-demo"
version = "0.1.0"
description = "可恢复、需人工审批的 IT 服务台 Agent 教学项目"
authors = [{name = "谢恒"}]
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4", "httpx>=0.27,<1"]

[project.urls]
Author = "https://github.com/xieheng48-bot"
Repository = "https://github.com/xieheng48-bot/langgraph"

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
